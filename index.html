<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner Chester Palmer</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #000; color: white; text-align: center; margin: 0; font-family: sans-serif; }
    .video-container { position: relative; width: 100%; height: 60vh; background: #222; overflow: hidden; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    .controls { padding: 20px; background: #111; position: fixed; bottom: 0; width: 100%; z-index: 100; }
    #status { font-weight: bold; min-height: 40px; }
    .overlay {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 3px solid rgba(0,255,0,0.6);
      width: 240px; height: 240px;
      border-radius: 20px; pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video id="video" playsinline muted></video>
    <div class="overlay"></div>
  </div>

  <div class="controls">
    <div id="status" class="text-warning mb-2">Toca el botón para iniciar la cámara</div>
    <button id="btnIniciar" class="btn btn-primary w-100 mb-3" onclick="iniciarCamara()">📷 INICIAR CÁMARA</button>
    <button class="btn btn-outline-danger w-100 btn-sm" onclick="volver()">VOLVER AL REGISTRO</button>
  </div>

  <script>
    // 🔧 PEGA AQUÍ TU URL /exec DE APPS SCRIPT
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyVFtqSlMDImC75d14U4319Eciri7DpLOytYkGHdrdS82nD1M3pRM056j5IuOSytN9FLQ/exec";

    // Configura el lector con escaneo más rápido
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const codeReader = new ZXing.BrowserMultiFormatReader(hints, 100); // 100ms entre intentos

    const status = document.getElementById('status');
    const btnIniciar = document.getElementById('btnIniciar');

    let leyendo = false, ultimoCodigo = null, ultimoTs = 0;

    // Beep al leer correctamente
    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880; osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.start(); osc.stop(ctx.currentTime + 0.2);
      } catch(e) {}
    }

    function setStatus(texto, clase) {
      status.className = (clase || 'text-warning') + ' mb-2';
      status.innerHTML = texto;
    }

    function manejarResultado(result) {
      const ahora = Date.now();
      const texto = result.getText();

      if (leyendo) return;
      if (texto === ultimoCodigo && (ahora - ultimoTs) < 3000) return;

      leyendo = true;
      ultimoCodigo = texto;
      ultimoTs = ahora;

      beep();
      if (navigator.vibrate) navigator.vibrate(120);
      setStatus('✅ Leído, validando...', 'text-info');

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ id: texto })
      })
      .then(r => r.json())
      .then(res => {
        if (res && res.status === 'success') {
          setStatus('🟢 BIENVENIDO: ' + res.nombre, 'text-success');
        } else {
          setStatus('🔴 ID DESCONOCIDO', 'text-danger');
        }
        setTimeout(() => {
          leyendo = false;
          setStatus('📸 Enfoca el siguiente QR', 'text-warning');
        }, 2000);
      })
      .catch(e => {
        setStatus('⚠️ Error de red: ' + e.message, 'text-danger');
        setTimeout(() => { leyendo = false; }, 2000);
      });
    }

    async function iniciarCamara() {
      setStatus('Iniciando cámara trasera...', 'text-warning');
      btnIniciar.disabled = true;

      try {
        try { codeReader.reset(); } catch (e) {}

        const constraints = {
          video: {
            facingMode: { ideal: 'environment' },
            width:  { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        await codeReader.decodeFromConstraints(
          constraints,
          'video',
          (result, err) => { if (result) manejarResultado(result); }
        );

        setStatus('📸 Acerca el QR al recuadro verde (~15-20 cm)', 'text-warning');
        btnIniciar.innerText = '✅ CÁMARA OK';
        btnIniciar.classList.remove('btn-primary');
        btnIniciar.classList.add('btn-success');
      } catch (err) {
        console.error(err);
        let msg;
        switch (err.name) {
          case 'NotAllowedError': msg = '❌ Permiso bloqueado. Toca el candado 🔒 → Cámara → Permitir.'; break;
          case 'NotFoundError': msg = '❌ No se detectó ninguna cámara.'; break;
          case 'NotReadableError': msg = '❌ La cámara está siendo usada por otra app.'; break;
          case 'OverconstrainedError':
            try {
              await codeReader.decodeFromConstraints({ video: true }, 'video', (r) => { if (r) manejarResultado(r); });
              setStatus('📸 Cámara activa (frontal). Enfoca el QR.', 'text-warning');
              btnIniciar.disabled = false; return;
            } catch (e2) { msg = '❌ Sin acceso a cámara: ' + e2.message; }
            break;
          default: msg = '❌ ' + err.name + ': ' + err.message;
        }
        setStatus(msg, 'text-danger');
        btnIniciar.innerText = '🔄 REINTENTAR';
      } finally {
        btnIniciar.disabled = false;
      }
    }

    function volver() {
      try { codeReader.reset(); } catch (e) {}
      const v = document.getElementById('video');
      if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
      if (window.history.length > 1) history.back();
      else window.close();
    }
  </script>
</body>
</html>
