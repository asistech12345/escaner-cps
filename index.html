<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #000; color: white; text-align: center; margin: 0; font-family: sans-serif; }
    .video-container { position: relative; width: 100%; height: 60vh; background: #222; overflow: hidden; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    .controls { padding: 20px; background: #111; position: fixed; bottom: 0; width: 100%; z-index: 100; }
    #status { font-weight: bold; min-height: 40px; }
    .overlay {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 3px solid rgba(0,255,0,0.6);
      width: 220px; height: 220px;
      border-radius: 20px; pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video id="video" playsinline muted></video>
    <div class="overlay"></div>
  </div>

  <div class="controls">
    <div id="status" class="text-warning mb-2">Toca el botón para iniciar la cámara</div>
    <button id="btnIniciar" class="btn btn-primary w-100 mb-3" onclick="iniciarCamara()">📷 INICIAR CÁMARA</button>
    <button class="btn btn-outline-danger w-100 btn-sm" onclick="volver()">VOLVER AL REGISTRO</button>
  </div>

  <script>
    const codeReader = new ZXing.BrowserMultiFormatReader();
    const status = document.getElementById('status');
    const btnIniciar = document.getElementById('btnIniciar');

    let leyendo = false;       // candado para evitar lecturas duplicadas
    let ultimoCodigo = null;   // último QR procesado
    let ultimoTs = 0;          // timestamp de la última lectura

    function setStatus(texto, clase) {
      status.className = (clase || 'text-warning') + ' mb-2';
      status.innerHTML = texto;
    }

    function manejarResultado(result) {
      const ahora = Date.now();
      const texto = result.getText();

      // Anti-rebote: ignorar el mismo código si llega < 3s después
      if (leyendo) return;
      if (texto === ultimoCodigo && (ahora - ultimoTs) < 3000) return;

      leyendo = true;
      ultimoCodigo = texto;
      ultimoTs = ahora;

      if (navigator.vibrate) navigator.vibrate(120);
      setStatus('✅ Leído, validando...', 'text-info');

      google.script.run
        .withSuccessHandler(res => {
          if (res && res.status === 'success') {
            setStatus('🟢 BIENVENIDO: ' + res.nombre, 'text-success');
          } else {
            setStatus('🔴 ID DESCONOCIDO', 'text-danger');
          }
          setTimeout(() => {
            leyendo = false;
            setStatus('📸 Enfoca el siguiente QR', 'text-warning');
          }, 2000);
        })
        .withFailureHandler(e => {
          setStatus('⚠️ Error de red: ' + (e && e.message ? e.message : e), 'text-danger');
          setTimeout(() => { leyendo = false; }, 2000);
        })
        .marcarAsistencia(texto);
    }

    async function iniciarCamara() {
      setStatus('Iniciando cámara trasera...', 'text-warning');
      btnIniciar.disabled = true;

      try {
        try { codeReader.reset(); } catch (e) {}

        // Pide directamente la cámara trasera (más confiable que listar dispositivos)
        await codeReader.decodeFromConstraints(
          { video: { facingMode: { ideal: 'environment' } } },
          'video',
          (result, err) => { if (result) manejarResultado(result); }
        );

        setStatus('📸 Cámara activa. Enfoca el QR.', 'text-warning');
        btnIniciar.innerText = '✅ CÁMARA OK';
        btnIniciar.classList.remove('btn-primary');
        btnIniciar.classList.add('btn-success');
      } catch (err) {
        console.error(err);
        let msg;
        switch (err.name) {
          case 'NotAllowedError':
            msg = '❌ Permiso bloqueado. Toca el candado 🔒 en la barra del navegador → Cámara → Permitir, y recarga.';
            break;
          case 'NotFoundError':
            msg = '❌ No se detectó ninguna cámara en este dispositivo.';
            break;
          case 'NotReadableError':
            msg = '❌ La cámara está siendo usada por otra app. Ciérrala y reintenta.';
            break;
          case 'SecurityError':
            msg = '❌ Bloqueada por seguridad. Abre la URL /exec directamente, no embebida.';
            break;
          case 'OverconstrainedError':
            msg = '⚠️ No hay cámara trasera. Probando con cualquier cámara...';
            setStatus(msg, 'text-warning');
            try {
              await codeReader.decodeFromConstraints(
                { video: true },
                'video',
                (result, err2) => { if (result) manejarResultado(result); }
              );
              setStatus('📸 Cámara activa (frontal). Enfoca el QR.', 'text-warning');
              btnIniciar.innerText = '✅ CÁMARA OK';
              btnIniciar.classList.remove('btn-primary');
              btnIniciar.classList.add('btn-success');
              btnIniciar.disabled = false;
              return;
            } catch (e2) {
              msg = '❌ Sin acceso a cámara: ' + e2.message;
            }
            break;
          default:
            msg = '❌ Error: ' + err.name + ' — ' + err.message;
        }
        setStatus(msg, 'text-danger');
        btnIniciar.innerText = '🔄 REINTENTAR';
        btnIniciar.classList.remove('btn-success');
        btnIniciar.classList.add('btn-primary');
      } finally {
        btnIniciar.disabled = false;
      }
    }

    function volver() {
      try { codeReader.reset(); } catch (e) {}
      // Apagar tracks para liberar la cámara y el LED
      const v = document.getElementById('video');
      if (v.srcObject) {
        v.srcObject.getTracks().forEach(t => t.stop());
        v.srcObject = null;
      }
      google.script.run.withSuccessHandler(url => window.top.location.href = url).getAppUrl();
    }
  </script>
</body>
</html>
