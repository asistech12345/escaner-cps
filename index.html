<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner | Chester Palmer School</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
  <style>
    :root {
      --navy: #1E2761;
      --red: #C42127;
      --bg: #0d1233;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: white;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }
    .topbar {
      background: linear-gradient(180deg, var(--navy) 0%, rgba(30,39,97,0.85) 100%);
      padding: 14px 20px; display: flex; align-items: center; gap: 12px;
      backdrop-filter: blur(10px); position: relative; z-index: 10;
    }
    .topbar img { height: 38px; width: auto; background: white; padding: 4px 8px; border-radius: 8px; }
    .topbar-text h1 { margin: 0; font-size: 14px; font-weight: 700; }
    .topbar-text p { margin: 0; font-size: 11px; opacity: 0.7; font-style: italic; }
    .video-container {
      flex: 1; position: relative; background: #000; overflow: hidden; min-height: 50vh;
    }
    #video { width: 100%; height: 100%; object-fit: cover; }
    .overlay-frame {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 260px; height: 260px;
      pointer-events: none;
    }
    .overlay-frame::before {
      content: ''; position: absolute; inset: 0;
      box-shadow: 0 0 0 9999px rgba(13,18,51,0.55);
      border-radius: 24px;
    }
    .corner {
      position: absolute; width: 40px; height: 40px;
      border: 4px solid var(--red);
    }
    .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 16px 0 0 0; }
    .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 16px 0 0; }
    .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 16px; }
    .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 16px 0; }
    .controls {
      background: rgba(13,18,51,0.95); backdrop-filter: blur(20px);
      padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .status-card {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 14px 18px; margin-bottom: 14px;
      text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 56px; font-size: 14px; font-weight: 600;
      transition: all 0.3s;
    }
    .status-card.success { background: rgba(16,185,129,0.15); border-color: var(--success); color: #6ee7b7; }
    .status-card.danger { background: rgba(239,68,68,0.15); border-color: var(--danger); color: #fca5a5; }
    .status-card.warning { background: rgba(245,158,11,0.12); border-color: var(--warning); color: #fcd34d; }
    .status-card.info { background: rgba(59,130,246,0.15); border-color: var(--info); color: #93c5fd; }
    button {
      width: 100%; font-family: inherit; font-size: 14px; font-weight: 700;
      border: none; border-radius: 12px; padding: 15px;
      cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary { background: var(--red); color: white; box-shadow: 0 6px 18px rgba(196,33,39,0.3); }
    .btn-primary:hover:not(:disabled) { background: #a01a1f; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-success { background: var(--success); color: white; }
    .btn-ghost {
      background: transparent; color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.15); margin-top: 10px;
      font-size: 12px; padding: 12px;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); color: white; }
    .btn-rescan {
      background: rgba(16,185,129,0.15); color: #6ee7b7;
      border: 1px solid #10b981; margin-top: 10px;
      font-size: 13px; padding: 13px;
    }
    .btn-rescan:hover { background: rgba(16,185,129,0.3); color: white; }
    .hint {
      text-align: center; font-size: 11px; opacity: 0.5; margin-top: 12px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <img src="logo.png" alt="Chester Palmer" onerror="this.style.display='none'">
    <div class="topbar-text">
      <h1>Escáner de Asistencia</h1>
      <p>"On the way to success"</p>
    </div>
  </div>

  <div class="video-container">
    <video id="video" playsinline muted></video>
    <div class="overlay-frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>
  </div>

  <div class="controls">
    <div id="status" class="status-card warning">
      <i class="fa-solid fa-circle-info"></i>
      <span>Toca el botón para iniciar la cámara</span>
    </div>
    <button id="btnIniciar" class="btn-primary" onclick="iniciarCamara()">
      <i class="fa-solid fa-camera"></i> INICIAR CÁMARA
    </button>
    <button id="btnRescanear" class="btn-rescan" onclick="rescanear()" style="display:none;">
      <i class="fa-solid fa-rotate-right"></i> ESCANEAR OTRO
    </button>
    <button class="btn-ghost" onclick="volver()">
      <i class="fa-solid fa-arrow-left"></i> Volver al registro
    </button>
    <p class="hint">Centra el QR dentro del recuadro a 15-20 cm</p>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5sP2YXtd1oGkMKKb_MFjPDNGzvu96WXKylfmx2amW2WRDtBCOGHnPAZXvo7jgcjHhVA/exec";

    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const codeReader = new ZXing.BrowserMultiFormatReader(hints, 100);

    const statusEl = document.getElementById('status');
    const btnIniciar = document.getElementById('btnIniciar');
    const btnRescanear = document.getElementById('btnRescanear');

    let leyendo = false, ultimoCodigo = null, ultimoTs = 0;

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880; osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.start(); osc.stop(ctx.currentTime + 0.2);
      } catch(e) {}
    }

    function setStatus(html, tipo) {
      statusEl.className = 'status-card ' + (tipo || 'warning');
      statusEl.innerHTML = html;
    }

    function rescanear() {
      leyendo = false;
      ultimoCodigo = null;
      btnRescanear.style.display = 'none';
      setStatus('<i class="fa-solid fa-camera"></i> <span>Listo, apunta al siguiente QR</span>', 'warning');
    }

    function manejarResultado(result) {
      const ahora = Date.now();
      const texto = result.getText();
      if (leyendo) return;
      if (texto === ultimoCodigo && (ahora - ultimoTs) < 3000) return;

      leyendo = true;
      ultimoCodigo = texto;
      ultimoTs = ahora;
      beep();
      if (navigator.vibrate) navigator.vibrate(120);
      setStatus('<i class="fa-solid fa-spinner fa-spin"></i> <span>Validando ' + texto + '...</span>', 'info');
      btnRescanear.style.display = 'none';

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ id: texto }),
        redirect: 'follow',
        signal: controller.signal
      })
      .then(r => { clearTimeout(timeoutId); if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(txt => {
        let res;
        try { res = JSON.parse(txt); }
        catch(e) { throw new Error('Respuesta no válida. ¿Redesplegaste el Code.gs?'); }
        if (res && res.status === 'success') {
          setStatus('<i class="fa-solid fa-circle-check"></i> <span>Bienvenido, ' + res.nombre + '</span>', 'success');
        } else {
          setStatus('<i class="fa-solid fa-circle-xmark"></i> <span>ID desconocido: ' + texto + '</span>', 'danger');
        }
        setTimeout(() => { btnRescanear.style.display = 'flex'; }, 800);
      })
      .catch(e => {
        clearTimeout(timeoutId);
        let msg = e.name === 'AbortError'
          ? 'Servidor no responde. Verifica el Code.gs.'
          : e.message;
        setStatus('<i class="fa-solid fa-triangle-exclamation"></i> <span>' + msg + '</span>', 'danger');
        setTimeout(() => { btnRescanear.style.display = 'flex'; }, 800);
      });
    }

    async function iniciarCamara() {
      setStatus('<i class="fa-solid fa-spinner fa-spin"></i> <span>Iniciando cámara...</span>', 'info');
      btnIniciar.disabled = true;
      try {
        try { codeReader.reset(); } catch (e) {}
        const constraints = { video: { facingMode: { ideal: 'environment' }, width: {ideal:1280}, height:{ideal:720} } };
        await codeReader.decodeFromConstraints(constraints, 'video',
          (result) => { if (result) manejarResultado(result); });
        setStatus('<i class="fa-solid fa-camera"></i> <span>Cámara activa. Apunta al QR</span>', 'warning');
        btnIniciar.classList.remove('btn-primary');
        btnIniciar.classList.add('btn-success');
        btnIniciar.innerHTML = '<i class="fa-solid fa-circle-check"></i> CÁMARA LISTA';
      } catch (err) {
        let msg;
        switch (err.name) {
          case 'NotAllowedError': msg = 'Permiso de cámara bloqueado'; break;
          case 'NotFoundError': msg = 'No se detectó cámara'; break;
          case 'NotReadableError': msg = 'Cámara en uso por otra app'; break;
          default: msg = err.message;
        }
        setStatus('<i class="fa-solid fa-triangle-exclamation"></i> <span>' + msg + '</span>', 'danger');
        btnIniciar.innerHTML = '<i class="fa-solid fa-rotate-right"></i> REINTENTAR';
      } finally {
        btnIniciar.disabled = false;
      }
    }

    function volver() {
      try { codeReader.reset(); } catch (e) {}
      const v = document.getElementById('video');
      if (v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
      if (window.history.length > 1) history.back();
      else window.close();
    }
  </script>
</body>
</html>
